name: Release

on:
  push:
    tags:
      - 'v*'
  # Signing dry run: builds, signs and notarizes a snapshot and uploads it as
  # a workflow artifact, publishing nothing. Signing is the one part of this
  # workflow no local run can exercise, so this is how a credential that
  # expired or a federated credential that does not match is found before a
  # tag needs it. Dispatch it from a branch named `signing-dry-run/...`: the
  # `windows-signing` environment only admits `v*` tags and that branch
  # pattern, and blocks the job before its first step on any other ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the Azure identifiers, the signing account and the Apple
    # credentials. Its deployment policy keeps them unreachable from
    # arbitrary branches, and the Azure federated credential trusts exactly
    # this environment.
    environment: windows-signing
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # OIDC token that azure/login exchanges
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      # Apple Developer ID certificate (.p12, base64) and App Store Connect
      # API key (.p8, base64), under the names GoReleaser's `notarize` block
      # reads.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      JSIGN_VERSION: '7.6'
      JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
    steps:
      # An unsigned binary is not a deliverable: Windows SmartScreen and
      # macOS Gatekeeper block it on download. Fail here, naming what is
      # missing, rather than letting the signing steps skip.
      - name: Require signing credentials
        run: |
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
                   AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE \
                   MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY_ID \
                   MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::signing credentials missing in the windows-signing environment: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Run tests
        run: go test ./...

      # Windows: Azure Trusted Signing via jsign, from a GoReleaser build
      # hook. macOS: GoReleaser's `notarize` block, from the MACOS_* env.

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download jsign
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/jsign-${JSIGN_VERSION}.jar"
          curl -fsSL -o "$jar" \
            "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          echo "${JSIGN_SHA256}  ${jar}" | sha256sum --check --strict
          echo "JSIGN_JAR=${jar}" >> "$GITHUB_ENV"

      # OIDC, no client secret. Leaves the Azure CLI logged in, and
      # scripts/sign-windows.sh takes its access token from that session.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checks the binaries that went into the archives rather than trusting
      # the steps above. GoReleaser creates the release as a draft (see
      # `release.draft` in .goreleaser.yaml), so nothing is public until
      # this passes and the last step publishes it.
      - name: Verify signatures
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends osslsigncode > /dev/null

          mapfile -t exes < <(find dist -mindepth 2 -type f -path '*_windows_*' -name '*.exe')
          mapfile -t machos < <(find dist -mindepth 2 -type f -path '*_darwin_*')
          echo "windows binaries: ${#exes[@]}, darwin binaries: ${#machos[@]}"
          [ "${#exes[@]}" -eq 4 ] || { echo "::error::expected 4 windows binaries"; exit 1; }
          [ "${#machos[@]}" -eq 4 ] || { echo "::error::expected 4 darwin binaries"; exit 1; }

          for f in "${exes[@]}"; do
            if ! osslsigncode extract-signature -in "$f" -out "$RUNNER_TEMP/sig.p7" > /dev/null; then
              echo "::error::no Authenticode signature: $f"; exit 1
            fi
            echo "$f signed by:"
            openssl pkcs7 -inform DER -in "$RUNNER_TEMP/sig.p7" -print_certs -noout | grep '^subject='
            rm -f "$RUNNER_TEMP/sig.p7"
          done

          # The Go linker ad-hoc signs darwin/arm64 binaries itself, so
          # "has a code signature" proves nothing. The Developer ID
          # certificate embedded in the signature does.
          for f in "${machos[@]}"; do
            if ! grep -q 'Developer ID Application' "$f"; then
              echo "::error::no Developer ID signature: $f"; exit 1
            fi
            echo "$f: Developer ID signature present"
          done

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signing-dry-run
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
